<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digging Up the Duggars — Episode Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: block;
      padding: 3rem 2rem 5rem;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      gap: 0;
    }

    .site-label {
      display: block;
      font-family: 'Courier Prime', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .site-label a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .site-label a:hover {
      color: var(--green);
    }

    header {
      margin-bottom: 1rem;
    }

    .eyebrow {
      font-family: 'Courier Prime', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.2;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--green-light);
      margin: 1.25rem 0;
    }

    .progress-section {
      margin-bottom: 1.25rem;
    }

    .progress-hero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 0.3rem;
    }

    .progress-fraction {
      font-family: 'Courier Prime', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .progress-bar {
      height: 2px;
      background: var(--green-light);
      position: relative;
      margin-bottom: 1rem;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--green);
      transition: width 0.5s ease;
    }

    .ep-info {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .ep-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      color: var(--ink);
      line-height: 1.4;
    }

    .ep-desc {
      font-family: 'Courier Prime', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-loading {
      font-family: 'Courier Prime', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.5;
    }

    .listen-btn {
      font-family: 'Courier Prime', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      background: var(--green);
      padding: 0.65rem 1.25rem;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s ease;
    }

    .listen-btn:hover {
      opacity: 0.85;
      color: var(--cream);
    }

    .spotify-section {
      margin-top: 1rem;
    }

    .spotify-label {
      font-family: 'Courier Prime', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .lock-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      opacity: 0.3;
      font-size: 0.65rem;
      padding: 0;
      margin-left: 0.4rem;
      transition: opacity 0.2s ease;
      line-height: 1;
      vertical-align: middle;
    }

    .lock-btn:hover {
      opacity: 0.65;
    }

    .admin-panel {
      display: none;
      margin-top: 1.5rem;
    }

    .admin-panel.visible {
      display: block;
    }

    .next-btn {
      font-family: 'Courier Prime', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      background: var(--green);
      padding: 0.65rem 1.25rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .next-btn:hover {
      opacity: 0.85;
    }

    .next-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .admin-msg {
      font-family: 'Courier Prime', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container fade-in">

    <span class="site-label"><a href="index.html">← tiny green fruit</a></span>

    <header>
      <p class="eyebrow">Podcast Episode Tracker</p>
      <h1>Digging Up the Duggars</h1>
    </header>

    <div class="divider"></div>

    <div class="progress-section">
      <div class="progress-hero" id="progressHero">— episodes and counting</div>
      <div class="progress-fraction" id="progressFraction">— / —<button class="lock-btn" id="lockBtn" onclick="handleLock()" title="admin">🔒</button></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="ep-info" id="epInfo">
        <span class="ep-loading">loading episode info...</span>
      </div>

      <div class="admin-panel" id="adminPanel">
        <button class="next-btn" id="nextBtn" onclick="markNextEpisode()">next episode →</button>
        <div class="admin-msg" id="adminMsg"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="spotify-section">
      <p class="spotify-label">listen now</p>
      <div id="spotifyEmbed"></div>
    </div>

  </div>



  <script>
    const SERVER = 'https://api.tinygreenfruit.com';
    const TOTAL = 176;

    let currentEpisode = null;
    let unlocked = false;
    let sessionPassword = null;

    async function init() {
      try {
        const res = await fetch(`${SERVER}/duggar/episode`);
        const data = await res.json();
        currentEpisode = data.episode;
        renderProgress();
        fetchEpisodeInfo();
      } catch(e) {
        document.getElementById('progressHero').textContent = '— episodes and counting';
      }
    }

    function renderProgress() {
      const pct = Math.round((currentEpisode / TOTAL) * 100);
      document.getElementById('progressHero').textContent = `${currentEpisode} episodes and counting`;
      document.getElementById('progressFraction').textContent = `${currentEpisode} / ${TOTAL}`;
      document.getElementById('progressFill').style.width = `${pct}%`;
    }

    async function fetchEpisodeInfo() {
      try {
        const res = await fetch(`${SERVER}/rss`);
        const text = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'text/xml');
        const items = Array.from(xml.querySelectorAll('item')).reverse();

        const ep = items[currentEpisode - 1];
        if (ep) {
          const title = ep.querySelector('title')?.textContent?.trim() || '';
          const rawDesc = (ep.querySelector('description')?.textContent || '')
            .replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').trim();

          const linkEl = ep.querySelector('link');
          const epLink = linkEl?.textContent?.trim() || '';

          document.getElementById('epInfo').innerHTML = `
            <span class="ep-title">${title}</span>
            <span class="ep-desc">${rawDesc}</span>
          `;

          document.getElementById('spotifyEmbed').innerHTML = `
            <a class="listen-btn" href="${epLink || 'https://open.spotify.com/show/30FmvDjIMrZioIoj2PyV0z'}" target="_blank" rel="noopener">Listen on Spotify →</a>
          `;
        }
      } catch(e) {
        document.getElementById('epInfo').innerHTML = '';
      }
    }

    function handleLock() {
      if (unlocked) {
        unlocked = false;
        sessionPassword = null;
        document.getElementById('adminPanel').classList.remove('visible');
        document.getElementById('lockBtn').textContent = '🔒';
        return;
      }

      const pw = prompt('password');
      if (!pw) return;

      sessionPassword = pw;
      unlocked = true;
      document.getElementById('adminPanel').classList.add('visible');
      document.getElementById('lockBtn').textContent = '🔓';
    }

    async function markNextEpisode() {
      const btn = document.getElementById('nextBtn');
      const msg = document.getElementById('adminMsg');
      btn.disabled = true;
      msg.textContent = '';

      try {
        const res = await fetch(`${SERVER}/duggar/episode`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: sessionPassword })
        });

        const data = await res.json();

        if (res.status === 401) {
          msg.textContent = 'wrong password.';
          unlocked = false;
          sessionPassword = null;
          document.getElementById('adminPanel').classList.remove('visible');
          document.getElementById('lockBtn').textContent = '🔒';
          return;
        }

        if (!res.ok) {
          msg.textContent = data.error || 'something went wrong.';
          return;
        }

        currentEpisode = data.episode;
        renderProgress();
        fetchEpisodeInfo();
        msg.textContent = `updated to episode ${data.episode}.`;

      } catch(e) {
        msg.textContent = 'could not reach server.';
      } finally {
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
